name: Build ntgcalls Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ntgcalls-android.yml"

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: NDK r30 / Clang 23 / arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout ntgcalls v3.0.6 source
        uses: actions/checkout@v4
        with:
          repository: pytgcalls/ntgcalls
          ref: "0471e78c5f82b3643516f1af395fd0b2b7853223"
          submodules: recursive
          path: ntgcalls-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget unzip zip ninja-build nasm yasm pkg-config libssl-dev

      - name: Limit Android build to ARM64
        working-directory: ntgcalls-source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("setup.py")
          s = p.read_text()
          old = "'android': ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'],"
          new = "'android': ['arm64-v8a'],"
          if old not in s:
              raise SystemExit("Could not find the expected Android architecture list; stopping safely.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build Android native library
        working-directory: ntgcalls-source
        run: |
          python -m pip install --upgrade pip setuptools
          python setup.py build_lib --target=android --static

      - name: Prepare matching Termux Python 3.14 Android development files
        working-directory: ntgcalls-source
        run: |
          set -euo pipefail
          mkdir -p ../termux-python
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz -o ../Packages.xz
          xz -dc ../Packages.xz > ../Packages
          python - <<'PY'
          from pathlib import Path
          text = Path("../Packages").read_text()
          matches = []
          for block in text.split("\n\n"):
              fields = {}
              for line in block.splitlines():
                  if ": " in line and not line.startswith(" "):
                      key, value = line.split(": ", 1)
                      fields[key] = value
              version = fields.get("Version", "")
              filename = fields.get("Filename", "")
              if fields.get("Package") == "python" and version.startswith("3.14.") and filename:
                  matches.append((version, filename))
          if not matches:
              raise SystemExit("No Termux Python 3.14 ARM64 package found in repository index.")
          matches.sort(key=lambda item: tuple(int(x) for x in item[0].split("-")[0].split(".")), reverse=True)
          Path("../python-package-candidates.txt").write_text("\n".join(path for _, path in matches))
          print("Found Python 3.14 package candidates:", len(matches))
          PY
          DOWNLOADED=0
          while IFS= read -r PACKAGE_PATH; do
            for BASE in https://packages.termux.dev/apt/termux-main https://packages-cf.termux.dev/apt/termux-main https://termux.librehat.com/apt/termux-main; do
              if curl --retry 1 --retry-delay 1 -fsSL "$BASE/$PACKAGE_PATH" -o ../python-termux.deb; then
                DOWNLOADED=1
                break 2
              fi
            done
          done < ../python-package-candidates.txt
          test "$DOWNLOADED" -eq 1
          dpkg-deb -x ../python-termux.deb ../termux-python
          PYROOT="$PWD/../termux-python/data/data/com.termux/files/usr"
          test -f "$PYROOT/include/python3.14/Python.h"
          PYLIB="$(find "$PYROOT/lib" -maxdepth 1 -name 'libpython3.14.so*' -type f -print -quit)"
          test -n "$PYLIB" && test -s "$PYLIB"
          echo "TERMUX_PYROOT=$PYROOT" >> "$GITHUB_ENV"
          echo "TERMUX_PYLIB=$PYLIB" >> "$GITHUB_ENV"
          echo "Termux Python 3.14 headers and library found."

      - name: Cross-compile Python binding for Android ARM64
        working-directory: ntgcalls-source
        run: |
          set -euo pipefail
          mkdir -p ../dist/python-binding
          cmake -S . -B build-python-android -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON -DBINDING=python -DANDROID_ABI=arm64-v8a -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/Toolchain.cmake" -DPython_EXECUTABLE="$(command -v python)" -DPython_INCLUDE_DIR="$TERMUX_PYROOT/include/python3.14" -DPython_LIBRARY="$TERMUX_PYLIB" -DPython_FIND_VERSION=3.14 -DPython_FIND_STRATEGY=LOCATION -DPython_FIND_IMPLEMENTATIONS=CPython -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/../dist/python-binding"
          cmake --build build-python-android --target ntgcalls --config Release -j2
          find ../dist/python-binding -maxdepth 1 -type f -name '*.so' -print -exec ls -lh {} \;
          test -n "$(find ../dist/python-binding -maxdepth 1 -type f -name '*.so' -print -quit)"

      - name: Package ARM64 library and matching NDK C++ runtime
        working-directory: ntgcalls-source
        run: |
          set -euo pipefail
          mkdir -p ../dist/ntgcalls-android-arm64
          LIB="$(find targets/android -type f -path '*/ntgcalls/arm64-v8a/libntgcalls.a' -print -quit)"
          test -n "$LIB" && test -s "$LIB"
          cp "$LIB" ../dist/ntgcalls-android-arm64/libntgcalls.a
          CXX_RUNTIME="$(find deps/ndk/src/toolchains/llvm/prebuilt -type f -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -print -quit)"
          test -n "$CXX_RUNTIME" && test -s "$CXX_RUNTIME"
          cp "$CXX_RUNTIME" ../dist/ntgcalls-android-arm64/libc++_shared.so
          {
            echo "ntgcalls source commit: 0471e78c5f82b3643516f1af395fd0b2b7853223"
            echo "ntgcalls version: 3.0.6"
            echo "Android ABI: arm64-v8a"
            echo "NDK: r30"
            echo "Clang: 23"
            echo "Built by GitHub Actions"
          } > ../dist/ntgcalls-android-arm64/BUILD-INFO.txt
          cd ../dist/ntgcalls-android-arm64
          sha256sum libntgcalls.a libc++_shared.so > SHA256SUMS.txt
          ls -lh

      - name: Upload Android ARM64 Python binding test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntgcalls-3.0.6-python314-android-arm64
          path: |
            dist/python-binding/*.so
            dist/ntgcalls-android-arm64/libc++_shared.so
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: ntgcalls-3.0.6-android-arm64
          path: dist/ntgcalls-android-arm64/
          if-no-files-found: error
          retention-days: 14
