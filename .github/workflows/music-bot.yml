name: ABHI MUSIC ROYAL EDITION

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        run: |
          test -n "$API_ID" || (echo "Missing API_ID secret" && exit 1)
          test -n "$API_HASH" || (echo "Missing API_HASH secret" && exit 1)
          test -n "$BOT_TOKEN" || (echo "Missing BOT_TOKEN secret" && exit 1)
          test -n "$STRING_SESSION" || (echo "Missing STRING_SESSION secret" && exit 1)

      - name: Start music bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        run: python -u royal_bot.py
